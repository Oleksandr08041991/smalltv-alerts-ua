name: Build SmallTV Ultra
on:
  push:
    branches: [feature/air-alerts-slim]
    tags: ['v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp8266:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Generate web interface
        run: |
          python tools/gzip_webui.py
          python tools/gzip_webui.py --check
      # Publishing a GitHub Release is the explicit OTA deployment gate.
      # The tag must match the version compiled into the binary; never
      # release an image with another version under a misleading name.
      - name: Check version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          cfg = pathlib.Path("src/config.h").read_text()
          match = re.search(r'^#define\s+FW_VERSION\s+"(\d+\.\d+\.\d+)"', cfg, re.M)
          if not match: raise SystemExit("FW_VERSION is not x.y.z")
          expected = "v" + match.group(1)
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Tag {os.environ['RELEASE_TAG']} != firmware {expected}")
          print(f"Verified release tag {expected}")
          PY
      - name: Build SmallTV Ultra firmware and one-time loader
        run: pio run -e smalltv -e smalltv_loader
      - name: Verify OTA firmware size and stage files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          slot=1044464
          files={"smalltv-mod-firmware.bin":Path(".pio/build/smalltv/firmware.bin"),
                 "smalltv-mod-loader.bin":Path(".pio/build/smalltv_loader/firmware.bin")}
          out=Path("dist"); out.mkdir(exist_ok=True)
          for name,path in files.items():
              size=path.stat().st_size
              free=slot-size
              print(f"{name}: {size:,} bytes, free OTA slot: {free:,} bytes ({free/slot:.1%})")
              if free < 8192:
                  raise SystemExit(f"OTA slot headroom too low: {name}")
              shutil.copy2(path,out/name)
          PY
      - name: Upload verified ESP8266 binaries
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-ultra-air-alerts
          path: dist/*.bin
          if-no-files-found: error
          retention-days: 30

  # A green ESP8266 build on a deliberately created version tag is promoted
  # into an actual GitHub Release. The firmware's /releases/latest API looks
  # here (NOT at Actions artifacts). No release on ordinary branch pushes.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: esp8266
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified ESP8266 images
        uses: actions/download-artifact@v4
        with:
          name: smalltv-ultra-air-alerts
          path: dist
      - name: Check required OTA asset exists
        run: |
          test -s dist/smalltv-mod-firmware.bin
          test -s dist/smalltv-mod-loader.bin
      - name: Create release with firmware for in-device OTA
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            dist/smalltv-mod-firmware.bin
            dist/smalltv-mod-loader.bin
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
